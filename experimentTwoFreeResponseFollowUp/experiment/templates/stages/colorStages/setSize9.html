<!DOCTYPE html>
<html>
  <head>
    <style>
      /* Center the images container */
      .images-grid {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 5px 0;
        width: 100%;
        height: 90vh;
      }

      /* Style for each row */
      .image-row {
        display: flex;
        justify-content: center;
        margin: 5px 0;
        flex-wrap: nowrap;
      }

      /* Style for each image wrapper */
      .image-wrapper {
        width: 120px;
        height: 120px;
        margin: 0 5px;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Style for the images */
      .image-wrapper img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      .image-wrapper.border {
        outline: 5px solid rgb(163, 163, 163);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <!-- Images go here -->
    <div class="images-grid">
      <!-- First row with 3 images -->
      <div class="image-row">
        <div id="one" class="image-wrapper">
          <img src="static/stimuli/colorShapes/circlegreen" />
        </div>
        <div id="two" class="image-wrapper">
          <img src="static/stimuli/colorShapes/circlegreen" />
        </div>
        <div id="three" class="image-wrapper">
          <img src="static/stimuli/colorShapes/circlegreen" />
        </div>
      </div>

      <!-- Second row with 3 images -->
      <div class="image-row">
        <div id="four" class="image-wrapper">
          <img src="static/stimuli/colorShapes/circlegreen" />
        </div>
        <div id="five" class="image-wrapper">
          <img src="static/stimuli/colorShapes/circlegreen" />
        </div>
        <div id="six" class="image-wrapper">
          <img src="static/stimuli/colorShapes/circlegreen" />
        </div>
      </div>

      <!-- Third row with 3 images -->
      <div class="image-row">
        <div id="seven" class="image-wrapper">
          <img src="static/stimuli/colorShapes/circlegreen" />
        </div>
        <div id="eight" class="image-wrapper">
          <img src="static/stimuli/colorShapes/circlegreen" />
        </div>
        <div id="nine" class="image-wrapper">
          <img src="static/stimuli/colorShapes/circlegreen" />
        </div>
      </div>
    </div>

    <div id="text_input">
      <div class="input-container">
        <!-- Text input field where users will type their responses -->
        <input
          type="text"
          class="text-input"
          id="user-input"
          placeholder="Type your description here"
        />
        <!-- Button that users will click to submit their response -->
        <button type="button" class="submit-button">Submit</button>
      </div>
    </div>

    <div class="tally" id="tally-container">
      <center>
        <h3 class="tally" id="tally"></h3>
      </center>
    </div>
    
  </body>
</html>
