<div id="container-exp">
  <div id="trial">
    <h1>
      We are now completing an audio check. Turn up your volume, and listen for the passcode. 
    </h1>

    <div id="play-button">
      <button type="button" class="play-button">
        Click here to listen to the password.
      </button>
    </div>

    <p>
      <b> 
        Please type the password into the text box, and click 'Submit'. 
      </b>
    </p>

    <div id="text_input">
      <div class="input-container">
        <!-- Text input field where users will type their responses -->
        <input
          type="text"
          class="text-input"
          id="user-input"
          placeholder="Type the password here"
        />

        <!-- Button that users will click to submit their response -->
        <button type="button" class="submit-button">Submit</button>
      </div>
    </div>
 
      <p>
        If you have no functioning audio on your device, please click the button below to end the experiment and return the study on Prolific. 
      </p>

      <div id ="finish-button">
        <button type="button" class="finish-button">End the Experiment</button>
      </div>

  </div>
</div>
